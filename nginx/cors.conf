# Included by every location that serves HLS. Re-included in nested locations because
# add_header in a child location replaces (rather than extends) the parent's headers.
add_header Access-Control-Allow-Origin * always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
# Lets Chrome fetch localhost from a public HTTPS page such as the hls.js demo.
add_header Access-Control-Allow-Private-Network true always;

# CORS / private-network preflight.
if ($request_method = OPTIONS) {
  return 204;
}
