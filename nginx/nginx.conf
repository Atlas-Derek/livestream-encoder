# Run from the repo root: npm run nginx (scripts/nginx.sh), which writes var/nginx/playback.conf first and then runs
# nginx -p "$PWD" -c nginx/nginx.conf -g 'daemon off;'. Relative paths resolve against the repo root.
worker_processes 1;
pid var/nginx/nginx.pid;
error_log stderr warn;

events {
  worker_connections 512;
}

http {
  types {
    text/html html;
    text/css css;
    application/javascript js;
    application/json json;
    application/vnd.apple.mpegurl m3u8;
    video/mp2t ts;
    video/mp4 mp4 m4s;
  }
  default_type application/octet-stream;

  access_log var/nginx/access.log;
  client_body_temp_path var/nginx/client_body;
  proxy_temp_path var/nginx/proxy;
  fastcgi_temp_path var/nginx/fastcgi;
  uwsgi_temp_path var/nginx/uwsgi;
  scgi_temp_path var/nginx/scgi;

  sendfile on;
  tcp_nopush on;

  # $hls_secret and $hls_signed_only, from PLAYBACK_SECRET (scripts/nginx.sh).
  include ../var/nginx/playback.conf;

  # Signed requests are served from one location, so their caching is chosen by file type here.
  map $uri $hls_cache_control {
    ~\.m3u8$ "no-cache";
    default "public, max-age=86400";
  }

  server {
    listen 8080;
    server_name localhost;

    # Test player page.
    location / {
      root nginx/html;
      index index.html;
    }

    # Encoder API, so the test page can call it same-origin. nginx listens on every interface so other devices
    # can play HLS, but the API can encode any file on disk and pull any URL, so it stays local.
    location /api/ {
      allow 127.0.0.1;
      allow ::1;
      deny all;
      proxy_pass http://127.0.0.1:3000/;
      proxy_set_header Host $host;
    }

    # HLS output: /hls/<channel>/... -> var/hls/<channel>/...
    # With PLAYBACK_SECRET set, only signed URLs play: /hls/_s/<expires>/<token>/<channel>/... (src/api/playback.ts).
    # The token is in the path so that the relative URIs inside playlists carry it too.
    location /hls/ {
      root var;
      include cors.conf;
      if ($hls_signed_only) {
        return 403;
      }

      # Channel ids can't start with _, so this never shadows a channel.
      location ~ ^/hls/_s/(?<hls_expires>\d+)/(?<hls_token>[A-Za-z0-9_-]+)/(?<hls_channel>[a-z0-9][a-z0-9_-]*)/(?<hls_path>.+)$ {
        secure_link $hls_token,$hls_expires;
        secure_link_md5 "$secure_link_expires$hls_channel $hls_secret";
        if ($hls_secret = "") {
          return 404;
        }
        if ($secure_link = "") {
          return 403;
        }
        if ($secure_link = "0") {
          return 410;
        }
        # As below: staging directories and ffmpeg's own playlists are never served.
        if ($hls_path ~ "(^|/)(\.|ffmpeg(-master)?\.m3u8$)") {
          return 404;
        }
        include cors.conf;
        add_header Cache-Control $hls_cache_control always;
        root var/hls;
        rewrite ^ /$hls_channel/$hls_path break;
      }

      # A VOD encode in progress (.building-<id>) or being swapped out (.previous-<id>): not playable yet.
      location ~ ^/hls/\. {
        return 404;
      }

      # ffmpeg's own live playlists; players get the published index.m3u8/master.m3u8 (src/hls/playlist.ts).
      location ~ /ffmpeg(-master)?\.m3u8$ {
        return 404;
      }

      # Playlists change every segment.
      location ~ \.m3u8$ {
        if ($hls_signed_only) {
          return 403;
        }
        include cors.conf;
        add_header Cache-Control "no-cache" always;
      }

      # Segments and fMP4 init files carry a per-run id (seg_<run>_<n>, init_<run>_<variant>.mp4), so a URL
      # never changes content.
      location ~ \.(ts|m4s|mp4)$ {
        if ($hls_signed_only) {
          return 403;
        }
        include cors.conf;
        add_header Cache-Control "public, max-age=86400" always;
      }
    }
  }
}
