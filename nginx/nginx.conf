# Run from the repo root: npm run nginx
# (nginx -p "$PWD" -c nginx/nginx.conf -g 'daemon off;'); relative paths resolve against the repo root.
worker_processes 1;
pid var/nginx/nginx.pid;
error_log stderr warn;

events {
  worker_connections 512;
}

http {
  types {
    text/html html;
    text/css css;
    application/javascript js;
    application/json json;
    application/vnd.apple.mpegurl m3u8;
    video/mp2t ts;
    video/mp4 mp4 m4s;
  }
  default_type application/octet-stream;

  access_log var/nginx/access.log;
  client_body_temp_path var/nginx/client_body;
  proxy_temp_path var/nginx/proxy;
  fastcgi_temp_path var/nginx/fastcgi;
  uwsgi_temp_path var/nginx/uwsgi;
  scgi_temp_path var/nginx/scgi;

  sendfile on;
  tcp_nopush on;

  server {
    listen 8080;
    server_name localhost;

    # Test player page.
    location / {
      root nginx/html;
      index index.html;
    }

    # Encoder API, so the test page can call it same-origin.
    location /api/ {
      proxy_pass http://127.0.0.1:3000/;
      proxy_set_header Host $host;
    }

    # HLS output: /hls/<channel>/... -> var/hls/<channel>/...
    location /hls/ {
      root var;
      include cors.conf;

      location ~ \.m3u8$ {
        include cors.conf;
        add_header Cache-Control "no-cache" always;
      }

      location ~ \.(ts|m4s|mp4)$ {
        include cors.conf;
        add_header Cache-Control "public, max-age=86400" always;
      }
    }
  }
}
